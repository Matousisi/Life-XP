<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi d'Objectifs &amp; XP</title>

    <!-- Police moderne Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Supabase (chargé une seule fois — il était en double avant) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <!-- Menu latéral -->
        <aside class="sidebar">
            <h1>Objectifs</h1>

            <nav class="menu-tabs">
                <button class="tab-button active" data-tab="categories">Catégories</button>
                <button class="tab-button" data-tab="summary">Synthèse</button>
            </nav>

            <div class="tab-content">
                <div class="categories" id="categories"></div>
                <div class="add-category">
                    <input type="text" id="new-category" placeholder="Nouvelle catégorie" maxlength="50">
                    <button id="btn-add-category" class="btn btn-primary btn-plus" title="Ajouter la catégorie">+</button>
                </div>
            </div>

            <div class="sidebar-footer">
                <div id="user-email" class="user-email"></div>
                <button id="btn-logout" class="btn btn-ghost">🚪 Déconnexion</button>
            </div>
        </aside>

        <!-- Contenu principal (généré par script.js) -->
        <main class="main"></main>
    </div>

    <!-- Notifications toast (générées par script.js) -->
    <div id="toast-container"></div>

    <!-- Fenêtres modales : remplacent alert / confirm / prompt -->
    <div id="modal-overlay">
        <div id="modal-box" class="modal-box"></div>
    </div>

    <!-- Écran de connexion -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Objectifs</h2>
            <p class="login-sub">Connecte-toi pour retrouver ta progression</p>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Mot de passe">
            <button id="btn-login" class="btn btn-primary">Se connecter</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
